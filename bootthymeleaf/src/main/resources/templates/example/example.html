<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Thymeleaf Examples</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>
    <div th:insert="~{example/example_fragment :: head}"></div>
    <ul>
        <li th:if="${isLogin}" th:text="${userName} + '님 반갑습니다.'"></li>
        <li th:unless="${isLogin}" th:text="로그인해주세요."></li>
    </ul>
    <div th:replace="~{example/example_fragment :: footer}"></div>
</body>

</html>
